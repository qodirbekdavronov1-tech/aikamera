<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Kamera</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 34px;
    }

    p {
      color: #d1d5db;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
    }

    button:hover {
      background: #16a34a;
    }

    .stop-btn {
      background: #f59e0b;
    }

    .stop-btn:hover {
      background: #d97706;
    }

    .camera-box {
      position: relative;
      width: 92%;
      max-width: 1000px;
      margin: 20px auto;
      border-radius: 18px;
      overflow: hidden;
      background: black;
      border: 2px solid #374151;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      margin: 15px auto;
      max-width: 900px;
      color: #d1d5db;
      background: #1f2937;
      padding: 12px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .small {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AI Kamera</h1>
    <p>Kamerani yoqing. Sayt buyumlarni taniydi va nomini o‘zbekcha ko‘rsatadi.</p>

    <button onclick="startCamera()">Kamerani yoqish</button>
    <button class="stop-btn" onclick="stopCamera()">To‘xtatish</button>
  </header>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <p id="status">Model yuklanmoqda...</p>

  <p class="small">
    Eslatma: ruchka, qalam, o‘chirg‘ich kabi mayda buyumlarni bu model har doim ham aniq tanimasligi mumkin.
  </p>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    let model = null;
    let running = false;
    let stream = null;

    const translations = {
      "person": "odam",

      "bicycle": "velosiped",
      "car": "mashina",
      "motorcycle": "mototsikl",
      "airplane": "samolyot",
      "bus": "avtobus",
      "train": "poyezd",
      "truck": "yuk mashinasi",
      "boat": "qayiq",
      "traffic light": "svetofor",
      "fire hydrant": "yong‘in gidranti",
      "stop sign": "to‘xtash belgisi",
      "parking meter": "parking hisoblagich",
      "bench": "skameyka",

      "bird": "qush",
      "cat": "mushuk",
      "dog": "it",
      "horse": "ot",
      "sheep": "qo‘y",
      "cow": "sigir",
      "elephant": "fil",
      "bear": "ayiq",
      "zebra": "zebra",
      "giraffe": "jirafa",

      "backpack": "ryukzak",
      "umbrella": "soyabon",
      "handbag": "sumka",
      "tie": "galstuk",
      "suitcase": "chemodan",

      "frisbee": "frisbi",
      "skis": "chang‘i",
      "snowboard": "snoubord",
      "sports ball": "to‘p",
      "kite": "varrak",
      "baseball bat": "beysbol tayoqchasi",
      "baseball glove": "beysbol qo‘lqopi",
      "skateboard": "skeytbord",
      "surfboard": "serf taxtasi",
      "tennis racket": "tennis raketkasi",

      "bottle": "butilka",
      "wine glass": "stakan",
      "cup": "piyola",
      "fork": "vilka",
      "knife": "pichoq",
      "spoon": "qoshiq",
      "bowl": "kosa",

      "banana": "banan",
      "apple": "olma",
      "sandwich": "sendvich",
      "orange": "apelsin",
      "broccoli": "brokkoli",
      "carrot": "sabzi",
      "hot dog": "hot-dog",
      "pizza": "pitsa",
      "donut": "ponchik",
      "cake": "tort",

      "chair": "stul",
      "couch": "divan",
      "potted plant": "gul tuvagi",
      "bed": "karavot",
      "dining table": "stol",
      "toilet": "hojatxona",

      "tv": "televizor",
      "laptop": "noutbuk",
      "mouse": "sichqoncha",
      "remote": "pult",
      "keyboard": "klaviatura",
      "cell phone": "telefon",

      "microwave": "mikroto‘lqinli pech",
      "oven": "pech",
      "toaster": "toster",
      "sink": "rakovina",
      "refrigerator": "muzlatkich",

      "book": "kitob yoki daftar",
      "clock": "soat",
      "vase": "vaza",
      "scissors": "qaychi",
      "teddy bear": "ayiqcha o‘yinchoq",
      "hair drier": "fen",
      "toothbrush": "tish cho‘tkasi",

      "pen": "ruchka",
      "pencil": "qalam",
      "eraser": "o‘chirg‘ich",
      "ruler": "chizg‘ich",
      "notebook": "daftar",
      "calculator": "kalkulyator",
      "paper": "qog‘oz",
      "folder": "papka",
      "glue": "yelim",
      "marker": "marker",
      "crayon": "rangli qalam",
      "paintbrush": "mo‘yqalam"
    };

    const schoolItems = [
      "book",
      "scissors",
      "backpack",
      "laptop",
      "mouse",
      "keyboard",
      "cell phone",
      "pen",
      "pencil",
      "eraser",
      "ruler",
      "notebook",
      "calculator",
      "paper",
      "folder",
      "glue",
      "marker",
      "crayon",
      "paintbrush"
    ];

    const penLikeItems = [
      "scissors",
      "toothbrush",
      "knife",
      "spoon",
      "fork",
      "remote"
    ];

    async function loadModel() {
      try {
        statusText.innerText = "Model yuklanmoqda, kuting...";
        model = await cocoSsd.load();
        statusText.innerText = "Model tayyor. Kamerani yoqing.";
      } catch (error) {
        statusText.innerText = "Model yuklanmadi. Internetni tekshiring.";
        console.error(error);
      }
    }

    async function startCamera() {
      if (!model) {
        statusText.innerText = "Model hali yuklanmoqda...";
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          running = true;
          statusText.innerText = "Kamera ishlayapti. Buyumni kameraga yaqinroq tuting.";
          detectObjects();
        };

      } catch (error) {
        statusText.innerText = "Kameraga ruxsat berilmadi yoki kamera topilmadi.";
        console.error(error);
      }
    }

    function stopCamera() {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      video.srcObject = null;
      statusText.innerText = "Kamera to‘xtatildi.";
    }

    function getCategoryText(englishName, isSchoolItem, isPossiblePen) {
      if (englishName === "person") {
        return "Odam";
      }

      if (isSchoolItem || isPossiblePen) {
        return "O‘quv quroli";
      }

      return "Buyum";
    }

    function getBoxColor(categoryText) {
      if (categoryText === "Odam") {
        return "#fbbf24";
      }

      if (categoryText === "O‘quv quroli") {
        return "#38bdf8";
      }

      return "#22c55e";
    }

    async function detectObjects() {
      if (!running || !model) return;

      const predictions = await model.detect(video);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let found = [];

      predictions.forEach(prediction => {
        const englishName = prediction.class;
        let uzbekName = translations[englishName];

        let minScore = 0.65;
        let isPossiblePen = false;

        if (penLikeItems.includes(englishName) && prediction.score >= 0.40) {
          uzbekName = "ruchka bo‘lishi mumkin";
          minScore = 0.40;
          isPossiblePen = true;
        }

        if (prediction.score < minScore) return;
        if (!uzbekName) return;

        let [x, y, width, height] = prediction.bbox;

        const shrink = 0.13;
        const shrinkX = width * shrink;
        const shrinkY = height * shrink;

        x = x + shrinkX;
        y = y + shrinkY;
        width = width - shrinkX * 2;
        height = height - shrinkY * 2;

        const percent = Math.round(prediction.score * 100);

        const isSchoolItem = schoolItems.includes(englishName);
        const categoryText = getCategoryText(englishName, isSchoolItem, isPossiblePen);
        const color = getBoxColor(categoryText);

        const text = `${uzbekName} ${percent}%`;

        found.push(`${uzbekName} (${categoryText})`);

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);

        ctx.font = "20px Arial";
        const textWidth = ctx.measureText(text).width;

        ctx.font = "15px Arial";
        const categoryWidth = ctx.measureText(categoryText).width;

        const boxWidth = Math.max(textWidth, categoryWidth) + 18;
        const boxHeight = 54;

        let textX = x;
        let textY = y - boxHeight - 5;

        if (textY < 0) {
          textY = y + 5;
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
        ctx.fillRect(textX, textY, boxWidth, boxHeight);

        ctx.fillStyle = color;
        ctx.font = "15px Arial";
        ctx.fillText(categoryText, textX + 8, textY + 19);

        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Arial";
        ctx.fillText(text, textX + 8, textY + 44);
      });

      if (found.length > 0) {
        statusText.innerText = "Topildi: " + [...new Set(found)].join(", ");
      } else {
        statusText.innerText = "Aniq buyum topilmadi. Buyumni yorug‘roq joyda yoki kameraga yaqinroq tuting.";
      }

      requestAnimationFrame(detectObjects);
    }

    loadModel();
  </script>

</body>
</html>
